<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Flores amarillas 🌻</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

  <main class="scene">

    <!-- Partículas luminosas -->
    <div class="stars" id="stars"></div>

    <!-- Dedicatoria superior -->
    <div class="dedication-top">

        <h1>Para mi pequeña Nini 💛</h1>

        <p>
            Si pudiera regalarte un poquito de la alegría
            que me das, no existirían flores suficientes
            en el mundo.
        </p>

        <p>
            Hoy te regalo estas flores amarillas para
            recordarte que, incluso en los días más grises,
            siempre habrá alguien que desee verte florecer.
        </p>

    </div>

    <!-- Ramo de flores -->
    <div class="bouquet" id="bouquet">

        <div class="flowers" id="flowers"></div>

        <div class="wrapper">
            <div class="wrapper-left"></div>
            <div class="wrapper-right"></div>
            <div class="wrapper-center"></div>
        </div>

        <div class="ribbon">
            <div class="ribbon-left"></div>
            <div class="ribbon-center"></div>
            <div class="ribbon-right"></div>
        </div>

    </div>

    <!-- Firma inferior -->
    <div class="dedication-bottom">

        <p>Con mucho cariño,</p>

        <h2>Tu inge 💛</h2>

    </div>

</main>

    <script src="script.js"></script>

</body>
</html>
